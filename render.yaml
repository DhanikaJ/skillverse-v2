# Render blueprint for the self-contained demo API (free plan, no database required).
# New > Blueprint > pick this repository. Free web services sleep when idle, so the first
# request after a quiet period can take up to a minute.
services:
  - type: web
    name: skillverse-demo-api
    runtime: docker
    plan: free
    # returns 503 until the demo data has been seeded, so traffic only arrives once logins work
    healthCheckPath: /api/v1/auth/demo-accounts
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      # Origin(s) of the deployed UI, comma-separated, no trailing slash
      - key: CORS_ALLOWED_ORIGINS
        value: https://skillverse-ui.vercel.app
      # Optional: keeps tokens valid across restarts (a random key is used if unset)
      - key: JWT_SECRET
        generateValue: true
