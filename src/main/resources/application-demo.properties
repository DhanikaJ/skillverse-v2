spring.application.name=skillverse-v2

# Demo profile: a self-contained sandbox showcase for free hosting.
# Uses an in-memory H2 database, so no external database is needed. Demo mode seeds all
# sample data on every start, which also means the data resets whenever the app restarts.

# Database (in-memory, recreated on every start)
spring.datasource.url=jdbc:h2:mem:skillverse-demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Demo mode is always on in this profile. The shared demo password is public by design.
app.demo.enabled=true
app.demo.password=${DEMO_PASSWORD:Demo@2026}

# JWT: set JWT_SECRET to keep tokens valid across restarts; otherwise a random key is used
# (the in-memory data resets on restart anyway, so existing tokens would be useless).
jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Uploads are disabled for demo accounts; these placeholders only let the app start.
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:unused}
cloudinary.api_key=${CLOUDINARY_API_KEY:unused}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:unused}

# API docs stay off on a public deployment
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Hosting platforms inject PORT
server.port=${PORT:8080}

# Quiet logging
logging.level.root=WARN
logging.level.com.skillverse=INFO

# CORS - set CORS_ALLOWED_ORIGINS to the origin(s) of the deployed UI
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://skillverse-ui.vercel.app}
